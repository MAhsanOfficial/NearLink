<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Sleek Dark Premium Brown/Black) -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2c1a12" />
      <stop offset="60%" stop-color="#140b07" />
      <stop offset="100%" stop-color="#080402" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8941f" />
      <stop offset="30%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#f4d03f" />
      <stop offset="100%" stop-color="#fff2a3" />
    </linearGradient>

    <!-- Metallic Green Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006424" />
      <stop offset="30%" stop-color="#00b140" />
      <stop offset="70%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#8cffca" />
    </linearGradient>

    <!-- Highlight Refractions for 3D Glossy Effect -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Inner Glow Gradient for background border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#00b140" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.5" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter for 3D Overlaps -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Neon Glow Filter for Location Pin & Connections -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="greenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luxury Background with rounded corners (App Icon Style) -->
  <rect width="504" height="504" x="4" y="4" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Ambient Glow Behind Logo -->
  <circle cx="256" cy="256" r="140" fill="#d4af37" opacity="0.08" filter="url(#goldGlow)" />
  <circle cx="256" cy="256" r="100" fill="#00b140" opacity="0.06" filter="url(#greenGlow)" />

  <!-- Background Decorative Grid Lines (Tech & AI theme) -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1.5">
    <line x1="80" y1="128" x2="432" y2="128" />
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="80" y1="384" x2="432" y2="384" />
    <line x1="128" y1="80" x2="128" y2="432" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <line x1="384" y1="80" x2="384" y2="432" />
    <!-- Diagonal mesh -->
    <line x1="80" y1="80" x2="432" y2="432" />
    <line x1="432" y1="80" x2="80" y2="432" />
  </g>

  <!-- The Interlocking 3D "N" Ribbon Logo -->
  <g transform="translate(0, 0)">
    
    <!-- LEFT STEM (Green Ribbon - Base layer) -->
    <!-- Curving up from bottom left, heading towards center -->
    <path d="M 130 380 
             C 130 250, 160 170, 230 140 
             L 255 185 
             C 200 210, 185 270, 185 380 Z" 
          fill="url(#greenGrad)" 
          filter="url(#shadow)" />

    <!-- RIGHT STEM (Gold Ribbon - Mid layer) -->
    <!-- Curving down from top right, heading towards center -->
    <path d="M 382 132 
             C 382 262, 352 342, 282 372 
             L 257 327 
             C 312 302, 327 242, 327 132 Z" 
          fill="url(#goldGrad)" 
          filter="url(#shadow)" />

    <!-- 3D CONNECTING BRIDGE (Interlocking fold) -->
    <!-- Overlapping center to create the diagonal of "N" and connection link -->
    <path d="M 185 380
             C 185 280, 240 240, 256 220
             C 272 200, 327 160, 327 132
             L 382 132
             C 382 180, 320 250, 280 290
             C 240 330, 185 350, 130 380 Z" 
          fill="url(#goldGrad)" 
          filter="url(#shadow)" />

    <!-- GREEN OVERLAP FLAP (Completes 3D lock & link concept) -->
    <path d="M 130 380 
             C 180 350, 230 320, 260 270
             C 270 250, 280 220, 256 220
             C 235 220, 215 250, 185 380 Z" 
          fill="url(#greenGrad)" />

    <!-- GLOSSY 3D GLASS HIGHLIGHTS (Overlay to give realistic reflection) -->
    <!-- Left Green highlight -->
    <path d="M 135 370 
             C 135 260, 162 180, 225 150 
             L 235 165
             C 180 195, 155 265, 155 370 Z" 
          fill="url(#highlightGrad)" 
          opacity="0.3" />

    <!-- Right Gold highlight -->
    <path d="M 377 142 
             C 377 252, 350 332, 287 362 
             L 277 347
             C 332 317, 357 247, 357 142 Z" 
          fill="url(#highlightGrad)" 
          opacity="0.35" />

    <!-- Bridge diagonal highlight -->
    <path d="M 195 350
             C 225 310, 275 255, 335 142
             L 355 142
             C 295 255, 245 310, 215 350 Z" 
          fill="url(#highlightGrad)" 
          opacity="0.25" />
  </g>

  <!-- Connection Nodes / AI Agent Points -->
  <!-- Bottom Left Node (Green Connection) -->
  <circle cx="157" cy="380" r="28" fill="#140b07" stroke="url(#greenGrad)" stroke-width="5" filter="url(#shadow)" />
  <circle cx="157" cy="380" r="12" fill="#00ff88" filter="url(#greenGlow)" />

  <!-- Top Right Node (Gold Connection) -->
  <circle cx="355" cy="132" r="28" fill="#140b07" stroke="url(#goldGrad)" stroke-width="5" filter="url(#shadow)" />
  <circle cx="355" cy="132" r="12" fill="#fff2a3" filter="url(#goldGlow)" />

  <!-- 3D Geolocation Pin in the Center (Floating style) -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Pin outer ring glow -->
    <ellipse cx="0" cy="32" rx="24" ry="8" fill="#000000" opacity="0.4" />
    
    <!-- Location Pin Shape -->
    <!-- Smooth 3D Pin with Gold gradient and Green detail -->
    <path d="M 0 -38 
             C -22 -38, -22 -15, 0 16 
             C 22 -15, 22 -38, 0 -38 Z" 
          fill="url(#goldGrad)" 
          stroke="#140b07" 
          stroke-width="3" />
    
    <!-- Pin highlight -->
    <path d="M -15 -25
             C -15 -35, -5 -35, 0 -35
             C -10 -35, -10 -25, -15 -25 Z" 
          fill="#ffffff" 
          opacity="0.4" />

    <!-- Center Core Dot (Green AI matching center) -->
    <circle cx="0" cy="-18" r="7" fill="url(#greenGrad)" stroke="#140b07" stroke-width="2" />
  </g>

  <!-- Subtle connecting network pulses -->
  <circle cx="210" cy="225" r="4" fill="#00ff88" opacity="0.8" />
  <circle cx="302" cy="287" r="4" fill="#f4d03f" opacity="0.8" />
</svg>
